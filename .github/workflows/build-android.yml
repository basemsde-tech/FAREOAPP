# Builds the Fareo Android app (Trusted Web Activity in ./twa).
# Push a tag like android-v16.0 (or run manually). The workflow builds an
# unsigned release APK and attaches it to a GitHub release of that tag; it is
# signed afterwards with the Fareo key, which never lives in this repo.
name: Build Fareo Android

on:
  workflow_dispatch:
  push:
    tags: ['android-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build unsigned release APK
        working-directory: twa
        env:
          FAREO_VERSION_CODE: ${{ github.run_number }}
          FAREO_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          ls -la app/build/outputs/apk/release/
      - name: Publish to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp twa/app/build/outputs/apk/release/app-release-unsigned.apk Fareo-unsigned.apk
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Fareo for Android ${GITHUB_REF_NAME#android-v}" --notes "Building…" --prerelease
          gh release upload "$GITHUB_REF_NAME" Fareo-unsigned.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: Fareo-unsigned-apk
          path: twa/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
