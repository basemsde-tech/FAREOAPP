# Builds the Fareo Android app (Trusted Web Activity in ./twa).
# Runs when twa/ changes on main (or manually). Builds an unsigned release APK
# and attaches it to a GitHub release tagged android-v<twa/version.txt>-b<run>;
# it is signed afterwards with the Fareo key, which never lives in this repo.
name: Build Fareo Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['twa/**', '.github/workflows/build-android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build unsigned release APK
        working-directory: twa
        env:
          FAREO_VERSION_CODE: ${{ github.run_number }}
        run: |
          export FAREO_VERSION_NAME="$(cat version.txt)"
          echo "TAG=android-v$(cat version.txt)-b${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          ls -la app/build/outputs/apk/release/
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp twa/app/build/outputs/apk/release/app-release-unsigned.apk Fareo-unsigned.apk
          gh release create "$TAG" Fareo-unsigned.apk --target "$GITHUB_SHA" --title "Fareo for Android ${TAG#android-v}" --notes "Unsigned build. The signed Fareo.apk is added to this release." --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: Fareo-unsigned-apk
          path: twa/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
